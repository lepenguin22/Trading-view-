name: CI

# Runs the same checks a contributor runs locally, so a pull request is
# verified by the repository rather than by whoever opened it.
on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same branch: only the head
# commit's result is worth waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned so a Flutter release cannot turn CI red on its own. Bump it
          # deliberately, with the tests run against the new version.
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        # --set-exit-if-changed makes unformatted code a failure rather than a
        # silent reformat that never reaches the diff.
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        # Warnings are failures here: the project is clean today, and letting
        # one through is how a codebase stops being clean.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only worth the Gradle cost once the cheap checks have passed.
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        # Release rather than debug: it exercises minification and icon tree
        # shaking, which is where a build actually breaks, and the result is
        # installable for testing. android/app/build.gradle.kts falls back to
        # the debug key when key.properties is absent, so this needs no secret
        # — and for the same reason the artifact is NOT for distribution.
        run: flutter build apk --release

      # Prints what the APK actually declares, rather than what the Gradle
      # config is believed to produce. An install failure on a device gives
      # almost no diagnostic, so the package name, version and signing
      # certificate are recorded here for every build.
      - name: Inspect the APK
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using $tools"

          "$tools/aapt2" dump badging "$apk" \
            | grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|native-code)" \
            | tee /tmp/badging.txt

          # Unfiltered on purpose. Which key signed the APK decides whether a
          # phone that already has the previous build will accept this one, and
          # a wrong answer shows up only as "App not installed" with nothing
          # else — so the whole certificate goes in the log.
          "$tools/apksigner" verify --print-certs -v "$apk"

          # Where that key came from. Without a keystore the build falls back to
          # Android's debug key, which is generated per machine on first use; a
          # runner is a fresh container every time. If this file was created
          # during this job, then every CI build carries a different
          # certificate and none of them can install over another.
          echo "--- debug keystore ---"
          ls -l --time-style=full-iso ~/.android/debug.keystore || echo "absent"
          date -u "+now is %Y-%m-%d %H:%M:%S"

          # The keystore-less build must carry its own application id, or it
          # collides with a real signed install and Android refuses it.
          if ! grep -q "name='io.github.lepenguin22.ticker.ci'" /tmp/badging.txt
          then
            echo "::error::APK package id is not the expected .ci variant"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # Named for what it is: signed with the public CI key, so it
          # installs for testing but is not a store build.
          name: app-release-ci-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
