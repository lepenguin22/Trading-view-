name: CI

# Runs the same checks a contributor runs locally, so a pull request is
# verified by the repository rather than by whoever opened it.
on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same branch: only the head
# commit's result is worth waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Only the release step writes; everything else reads. Declared at the top so
# the default read-only token covers the checks, and the one job that needs
# more asks for it.
permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned so a Flutter release cannot turn CI red on its own. Bump it
          # deliberately, with the tests run against the new version.
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        # --set-exit-if-changed makes unformatted code a failure rather than a
        # silent reformat that never reaches the diff.
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        # Warnings are failures here: the project is clean today, and letting
        # one through is how a codebase stops being clean.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only worth the Gradle cost once the cheap checks have passed.
    needs: analyze-and-test
    # Creating a release writes a tag and an asset; nothing else here does.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        # Release rather than debug: it exercises minification and icon tree
        # shaking, which is where a build actually breaks, and the result is
        # installable for testing. android/app/build.gradle.kts falls back to
        # the debug key when key.properties is absent, so this needs no secret
        # — and for the same reason the artifact is NOT for distribution.
        run: flutter build apk --release

      # Prints what the APK actually declares, rather than what the Gradle
      # config is believed to produce. An install failure on a device gives
      # almost no diagnostic, so the package name, version and signing
      # certificate are recorded here for every build.
      - name: Inspect the APK
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using $tools"

          "$tools/aapt2" dump badging "$apk" \
            | grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|native-code)" \
            | tee /tmp/badging.txt

          # Unfiltered on purpose. Which key signed the APK decides whether a
          # phone that already has the previous build will accept this one, and
          # a wrong answer shows up only as "App not installed" with nothing
          # else — so the whole certificate goes in the log.
          "$tools/apksigner" verify --print-certs -v "$apk" | tee /tmp/signing.txt

          # The keystore-less build must carry its own application id, or it
          # collides with a real signed install and Android refuses it.
          if ! grep -q "name='io.github.lepenguin22.ticker.ci'" /tmp/badging.txt
          then
            echo "::error::APK package id is not the expected .ci variant"
            exit 1
          fi

          # And it must carry the committed CI certificate. A build that fell
          # back to Android's debug key would be signed by a different
          # certificate on every runner, and a phone that already has the last
          # build would refuse this one with nothing but "App not installed".
          expected=0d2a1aea4f1a856e15f50e0cc0810a4351e6b5908426498e17e56992bd9db48d
          if ! grep -qi "certificate SHA-256 digest: $expected" /tmp/signing.txt
          then
            echo "::error::APK is not signed with the committed CI key"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # Named for what it is: signed with the public CI key, so it
          # installs for testing but is not a store build.
          name: app-release-ci-signed-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # An artifact is a zip behind a GitHub login, which is no way to install
      # a phone app: the download button is simply absent when signed out, and
      # a link tapped from a chat app opens in a webview that does not carry
      # the session. A release asset is a plain file on a plain URL.
      #
      # The asset name is fixed rather than versioned, because that is what
      # makes /releases/latest/download/ticker.apk work — one permanent link
      # that always serves the newest build, with nothing to look up.
      - name: Rename for the release asset
        if: github.ref == 'refs/heads/main'
        run: cp build/app/outputs/flutter-apk/app-release.apk ticker.apk

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Tagged by run number, which is monotonic and needs no version
        # bookkeeping. --latest is explicit: the permanent download URL
        # resolves through it, and letting GitHub infer it from tag order
        # would break the link the first time a tag sorted oddly.
        run: |
          set -euo pipefail
          gh release create "build-${{ github.run_number }}" ticker.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Build ${{ github.run_number }}" \
            --notes "$(cat <<'NOTES'
          Always-newest download:
          https://github.com/lepenguin22/Trading-view-/releases/latest/download/ticker.apk

          Signed with the CI key committed to this repository, so it installs
          over the previous build without uninstalling. That key is public:
          anyone can sign an APK with it, so treat this as a personal test
          build and not something to pass on.
          NOTES
          )"
        # The release is a convenience, not the build's verdict. A tag that
        # already exists, or a permissions change, must not turn a green build
        # red — the artifact above is still there either way.
        continue-on-error: true
